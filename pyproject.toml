[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "guardtrellis"
version = "0.1.0a2"
description = "Composable local checks around model inputs, outputs, retrieval, and tools"
authors = [{ name = "Sahil Mathur" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<0.38"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/sahilmathur254/guardtrellis"
Issues = "https://github.com/sahilmathur254/guardtrellis/issues"
Documentation = "https://github.com/sahilmathur254/guardtrellis/blob/main/docs/api.md"
Changelog = "https://github.com/sahilmathur254/guardtrellis/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/users/sahilmathur254/projects/3"

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]
langgraph = ["langgraph>=1,<2", "langsmith>=0.3,<1"]
openai = [
    "httpx>=0.27,<1",
    "openai>=2,<3",
]
gemini = ["google-genai>=2.25,<3", "httpx>=0.28.1,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "mypy>=1.15,<3", "types-jsonschema>=4.23"]
release = ["twine>=7,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/guardtrellis"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/examples", "/evaluation", "/docs", "/scripts", "/README.md", "/CONTRIBUTING.md", "/ROADMAP.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/guardtrellis"]
