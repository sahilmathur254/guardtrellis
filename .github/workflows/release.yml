name: release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Validate only, rehearse on TestPyPI, or promote a verified rehearsal to PyPI
        type: choice
        options: [validate, testpypi, pypi]
        default: validate
        required: true
      rehearsal_run_id:
        description: Successful TestPyPI run ID from this exact main commit (required for PyPI)
        type: string
        required: false
      rehearsal_artifact_id:
        description: Candidate artifact ID from the rehearsal candidate upload step (required for PyPI)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'pull_request' || inputs.target != 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload-candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Check publication prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = sahilmathur254/guardtrellis
          test "$GITHUB_REF" = refs/heads/main
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --event push --limit 1 --json status,conclusion,headSha |
            jq -e --arg sha "$GITHUB_SHA" 'length == 1 and .[0].headSha == $sha and .[0].status == "completed" and .[0].conclusion == "success"'
          gh api "repos/$GITHUB_REPOSITORY/environments/testpypi" |
            jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))'
      - name: Install release tooling
        run: |
          python -m pip install 'uv==0.8.17'
          uv sync --frozen --no-dev --group release
      - name: Check release version agreement
        run: python scripts/release_artifacts.py check
      - name: Build and validate both distributions
        run: |
          uv build
          uv run --frozen --no-dev --group release python -m twine check --strict dist/*
          uv run --frozen --no-dev --group release python scripts/release_artifacts.py create \
            --bundle "$RUNNER_TEMP/candidate" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          cat "$RUNNER_TEMP/candidate/release.json" >> "$GITHUB_STEP_SUMMARY"
      - id: upload-candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  smoke-candidate:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id || 'missing-producer-artifact-id' }}
          merge-multiple: true
          path: ${{ runner.temp }}/smoke-candidate
      # This runner owns disposable copies only. Never upload its package files.
      - name: Smoke-test the sealed candidate on a separate runner
        run: |
          python -m pip install 'uv==0.8.17'
          python scripts/release_artifacts.py verify --bundle "$RUNNER_TEMP/smoke-candidate" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          python scripts/smoke_dist.py --dist-dir "$RUNNER_TEMP/smoke-candidate/dist"

  testpypi:
    needs: [candidate, smoke-candidate]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/guardtrellis/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id || 'missing-producer-artifact-id' }}
          merge-multiple: true
          path: release-bundle
      - name: Check artifact hashes
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS
      - name: Publish the checked files to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-bundle/dist/
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: [candidate, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id || 'missing-producer-artifact-id' }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Download the actual index files and smoke-test installations
        run: |
          python -m pip install 'uv==0.8.17'
          python scripts/release_artifacts.py fetch --bundle "$RUNNER_TEMP/candidate" \
            --commit "$GITHUB_SHA" --index testpypi --destination "$RUNNER_TEMP/testpypi-dist"
          python scripts/smoke_dist.py --dist-dir "$RUNNER_TEMP/testpypi-dist"

  retain-testpypi:
    needs: [candidate, verify-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Pin the producer's ID: another runner can delete/recreate an artifact name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id || 'missing-producer-artifact-id' }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Retain the unchanged candidate only after the rehearsal succeeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testpypi-verified
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload-pypi-candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Require a successful rehearsal from the same main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
          REHEARSAL_ARTIFACT_ID: ${{ inputs.rehearsal_artifact_id }}
        run: |
          test "$GITHUB_REPOSITORY" = sahilmathur254/guardtrellis
          test "$GITHUB_REF" = refs/heads/main
          if [[ ! "$REHEARSAL_RUN_ID" =~ ^[0-9]+$ || ! "$REHEARSAL_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "PyPI promotion requires numeric rehearsal run and candidate artifact IDs" >&2
            exit 1
          fi
          REHEARSAL_REPOSITORY_ID=$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL_RUN_ID" |
              jq -er --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
                --arg run "$REHEARSAL_RUN_ID" '
                select(.id == ($run | tonumber) and
                  .status == "completed" and .conclusion == "success" and
                  .event == "workflow_dispatch" and .path == ".github/workflows/release.yml" and
                  .head_branch == "main" and .head_sha == $sha and
                  .repository.full_name == $repo and .head_repository.full_name == $repo and
                  (.repository.id | type == "number")) | .repository.id'
          )
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL_RUN_ID/jobs?filter=all&per_page=100" |
            jq -e '
              .jobs as $jobs |
              .total_count == ($jobs | length) and .total_count <= 100 and
              all(["candidate", "smoke-candidate", "testpypi", "verify-testpypi", "retain-testpypi"][];
                . as $name | [$jobs[] | select(.name == $name)] |
                length > 0 and all(.[]; .run_attempt | type == "number") and
                (max_by(.run_attempt).run_attempt as $latest |
                  map(select(.run_attempt == $latest)) |
                  length == 1 and .[0].status == "completed" and .[0].conclusion == "success"))'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REHEARSAL_ARTIFACT_ID" |
            jq -e --arg artifact "$REHEARSAL_ARTIFACT_ID" --arg run "$REHEARSAL_RUN_ID" \
              --arg repo_id "$REHEARSAL_REPOSITORY_ID" --arg sha "$GITHUB_SHA" '
              .id == ($artifact | tonumber) and .name == "candidate" and .expired == false and
              .workflow_run.id == ($run | tonumber) and
              .workflow_run.repository_id == ($repo_id | tonumber) and
              .workflow_run.head_repository_id == ($repo_id | tonumber) and
              .workflow_run.head_branch == "main" and .workflow_run.head_sha == $sha'
          gh api "repos/$GITHUB_REPOSITORY/environments/pypi" |
            jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.rehearsal_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rehearsal_run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-verified
          path: ${{ runner.temp }}/testpypi-verified
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rehearsal_run_id }}
      - name: Require clean retention of the original rehearsal candidate
        run: diff --recursive "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/testpypi-verified"
      - name: Verify provenance, package metadata, and hashes before promotion
        env:
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        run: |
          python scripts/release_artifacts.py verify --bundle "$RUNNER_TEMP/candidate" \
            --commit "$GITHUB_SHA" --run-id "$REHEARSAL_RUN_ID"
          cat "$RUNNER_TEMP/candidate/release.json" >> "$GITHUB_STEP_SUMMARY"
      - id: upload-pypi-candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  pypi:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/guardtrellis/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.promote.outputs.artifact-id || 'missing-producer-artifact-id' }}
          merge-multiple: true
          path: release-bundle
      - name: Check artifact hashes
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS
      - name: Publish the rehearsed files to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-bundle/dist/

  verify-pypi:
    needs: [promote, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.promote.outputs.artifact-id || 'missing-producer-artifact-id' }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Verify public PyPI artifacts and fresh installations
        run: |
          python -m pip install 'uv==0.8.17'
          python scripts/release_artifacts.py fetch --bundle "$RUNNER_TEMP/candidate" \
            --commit "$GITHUB_SHA" --index pypi --destination "$RUNNER_TEMP/pypi-dist"
          python scripts/smoke_dist.py --dist-dir "$RUNNER_TEMP/pypi-dist"

  retain-pypi:
    needs: [promote, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.promote.outputs.artifact-id || 'missing-producer-artifact-id' }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-verified
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
