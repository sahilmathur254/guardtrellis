name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # Fail on any command in a multi-command step, including on Windows.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15
            python: "3.12"
          - os: windows-2025
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install 'uv==0.8.17'
      - name: Install locked dependencies and optional examples
        run: uv sync --frozen --all-extras --group dev --python '${{ matrix.python }}'
      - name: Test behavior and runnable examples
        run: uv run --frozen pytest
      - name: Check lint, formatting, and types
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          uv run --frozen mypy examples/openai_app.py examples/azure_openai_app.py
      - name: Reproduce smoke evaluation
        run: uv run --frozen python evaluation/run.py --report-dir '${{ runner.temp }}/guardtrellis-eval'
      - name: Build and install both distributions outside the checkout
        run: |
          uv build
          uv run --frozen python scripts/smoke_dist.py
