name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # Fail on any command in a multi-command step, including on Windows.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15
            python: "3.12"
          - os: windows-2025
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install 'uv==0.8.17'
      - name: Check release version agreement
        run: python scripts/release_artifacts.py check
      - name: Install locked dependencies and optional examples
        run: uv sync --frozen --all-extras --group dev --group build --python '${{ matrix.python }}'
      - name: Test behavior and runnable examples
        run: uv run --frozen pytest
      - name: Check lint, formatting, and types
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          uv run --frozen mypy examples/retrieval_tools.py examples/policy_operations.py examples/decoded_query.py examples/decoded_contact.py examples/tool_result_handoff.py examples/cli_ci.py
          uv run --frozen mypy examples/openai_app.py examples/azure_openai_app.py examples/gemini_app.py
      - name: Reproduce smoke evaluation
        run: uv run --frozen python evaluation/run.py --report-dir '${{ runner.temp }}/guardtrellis-eval'
      - name: Reproduce Unicode and PII challenges
        run: |
          uv run --frozen python evaluation/run.py \
            --corpus evaluation/challenges/unicode_pii_v1.jsonl \
            --report-dir '${{ runner.temp }}/guardtrellis-challenges'
      - name: Reproduce policy combination and delivery evaluation
        run: |
          uv run --frozen python evaluation/policy_combinations/run.py \
            --report-dir '${{ runner.temp }}/guardtrellis-policy-combinations'
      - name: Reproduce escaped-JSON and phone detection coverage
        run: |
          uv run --frozen python evaluation/policy_combinations/run.py \
            --corpus evaluation/policy_combinations/detection_coverage_v1.jsonl \
            --report-dir '${{ runner.temp }}/guardtrellis-detection-coverage'
      - name: Reproduce the bounded decoded contact comparison
        run: |
          uv run --frozen python evaluation/decoded_contact/run.py \
            --report-dir '${{ runner.temp }}/guardtrellis-decoded-contact'
      - name: Compare default and formatted-phone policies with bounded resource probes
        run: |
          uv run --frozen python evaluation/formatted_phone/run.py --resources \
            --report-dir '${{ runner.temp }}/guardtrellis-formatted-phone'
      - name: Verify bounded concurrency and checked delivery
        run: |
          uv run --frozen python evaluation/concurrency/run.py --smoke \
            --report-dir '${{ runner.temp }}/guardtrellis-concurrency'
      - name: Reproduce frozen synchronous scan outcomes and bounded measurements
        run: |
          uv run --frozen python evaluation/scan_performance/run.py --smoke \
            --report-dir '${{ runner.temp }}/guardtrellis-scan-performance'
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(r'${{ runner.temp }}/guardtrellis-scan-performance/results.json').read_text())
          print(json.dumps({
              "measurement_checks_passed": report["measurement_checks_passed"],
              "cells": len(report["summary"]),
              "expected_samples": sum(row["expected_samples"] for row in report["summary"]),
              "observed_samples": sum(row["observed_samples"] for row in report["summary"]),
              "matching_samples": sum(row["matching_samples"] for row in report["summary"]),
              "all_children_reaped": all(row.get("child_reaped") for row in report["runs"]),
          }, sort_keys=True))
          PY
      - name: Reproduce connection-string coverage and checked delivery
        run: |
          uv run --frozen python evaluation/connection_strings/run.py \
            --report-dir '${{ runner.temp }}/guardtrellis-connection-strings'
      - name: Reproduce the connection-string contract supplement
        run: |
          uv run --frozen python evaluation/connection_strings/run_supplement.py \
            --report-dir '${{ runner.temp }}/guardtrellis-connection-contract'
      - name: Reproduce connection-string structural boundaries
        run: |
          uv run --frozen python evaluation/connection_strings/run_supplement.py \
            --corpus evaluation/connection_strings/boundaries_v1.jsonl \
            --report-dir '${{ runner.temp }}/guardtrellis-connection-boundaries'
      - name: Compare opt-in connection URIs and bounded direct-scanner work
        run: |
          uv run --frozen python evaluation/connection_strings/opt_in.py --resources \
            --report-dir '${{ runner.temp }}/guardtrellis-connection-opt-in'
      - name: Reproduce frozen detector and checked-delivery challenges
        run: |
          uv run --frozen python evaluation/detector_delivery/run.py \
            --report-dir '${{ runner.temp }}/guardtrellis-detector-delivery'
      - name: Build and install both distributions outside the checkout
        run: |
          uv build --offline --no-build-isolation
          uv run --frozen python scripts/smoke_dist.py
